# Site
name: "Isla Louise"
title: "Isla Louise"
description: "Dive into my travel adventures and love for books"
logo: 'assets/images/logo.png'
favicon: 'assets/images/logo.png'
url: "https://www.islalouise.com"
baseurl: /
google_analytics: 'UA-46278016-1'
disqus: 'islalouise-com'
include: ["_pages"]
permalink: /:title/

# Authors
authors:
  isla:
    name: Isla
    display_name: Isla
    gravatar: 386153df177bc837748b0f85a022d4b240c119ce865eb0b6067c6dc130a5b415
    email: islabirnie@gmail.com
    web: http://www.islalouise.com
#    twitter: https://twitter.com/wowthemesnet
    description: "Author of IslaLouise."

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-archives
    
# Archives
jekyll-archives:
  enabled:
    - categories
  layout: archive
  permalinks:
    category: '/category/:name/'
    
# Pagination 
paginate: 6
paginate_path: /page:num/
    
# Other
markdown: kramdown

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: true

# Adsense (change to "enabled" to activate, also your client id and ad slot. Create a new ad unit from your Adsense account to get the slot.)
adsense: "disabled"
adsense-data-ad-client: "ca-pub-3412143450191416"
adsense-data-ad-slot: "1363087678"

# Lazy Images ("enabled" or "disabled")
lazyimages: "disabled"

exclude: [changelog.md, LICENSE.txt, README.md, Gemfile, Gemfile.lock]
